[project]
name = "aria-et"
version = "0.1.0"
description = "Eye-tracking paradigms for the ARIA ABCCT battery recreation."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "psychopy>=2026.1.3",
    "titta>=2.2.2",
]

[project.scripts]
aria-et = "aria_et.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aria_et"]

[tool.pytest.ini_options]
testpaths = ["tests"]

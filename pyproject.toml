[project]
name = "aria-et"
version = "0.1.0"
description = "Eye-tracking paradigms for the ARIA ABCCT battery recreation."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "psychopy",
    "tomli",
    "tobii-research",
    "typing-extensions",
]

[project.optional-dependencies]
test = [
    "bids-validator-deno",
    "pre-commit",
    "pytest",
    "ruff",
]
docs = [
    "sphinx",
    "sphinxcontrib-youtube",
    "furo",
]

[project.scripts]
aria-et = "aria_et.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aria_et*"]

[tool.setuptools.package-data]
aria_et = ["assets/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "psychopy_smoke: opt-in GUI smoke tests that open real PsychoPy windows",
    "requires_eyetracker: opt-in hardware smoke tests that require a connected Tobii eye tracker",
]

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py"]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".egg-info",
    ".git",
    ".gitignore",
    ".pytest_cache",
    ".ruff_cache",
    ".svn",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
]

# Set the source directory root for import resolution (isort)
src = ["src"]

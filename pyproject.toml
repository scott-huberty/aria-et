[project]
name = "aria-et"
version = "0.1.0"
description = "Eye-tracking paradigms for the ARIA ABCCT battery recreation."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "dvst-detox==0.2.1",
    "opencv-python",
    "psychopy==2026.2.1",
    "tomli",
    "tobii-research==2.1.0",
    "typing-extensions",
]

[project.optional-dependencies]
logo = [
    "matplotlib==3.10.9",
    "numpy==2.2.6",
    "Pillow==12.3.0",
]
test = [
    "bids-validator-deno",
    "pre-commit",
    "pytest",
    "ruff",
    "ty",
]
docs = [
    "sphinx",
    "sphinxcontrib-youtube",
    "furo",
]
gui = [
    "PySide6>=6.6",
]

[project.scripts]
aria-et = "aria_et.cli:main"
aria-et-gui = "aria_et.gui.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aria_et*"]

[tool.setuptools.package-data]
aria_et = ["assets/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "psychopy_smoke: opt-in GUI smoke tests that open real PsychoPy windows",
    "requires_eyetracker: opt-in hardware smoke tests that require a connected Tobii eye tracker",
    "qt_gui: opt-in tests that construct real Qt widgets",
]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"


[tool.ruff]
include = ["pyproject.toml", "src/**/*.py"]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".egg-info",
    ".git",
    ".gitignore",
    ".pytest_cache",
    ".ruff_cache",
    ".svn",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
]

# Set the source directory root for import resolution (isort)
src = ["src"]

[tool.ruff.lint]
# Every function in src has type annotations (tests are type-checked by ty
# but are not linted by ruff; see `include`).
extend-select = ["ANN"]

[tool.ruff.lint.flake8-annotations]
# An __init__ with annotated arguments needs no "-> None" (as in mypy).
mypy-init-return = true


[tool.numpydoc_validation]
# All checks except examples (EX01), See Also (SA01), extended summary (ES01)
# and GL01: the summary starts on the opening-quote line, as ruff formats it.
checks = ["all", "EX01", "SA01", "ES01", "GL01"]
# Private names are not API.
exclude = ['\._']

[tool.ty.rules]

[tool.ty.environment]
python = ".pixi/envs/default"
root = ["./src"]

[tool.ty.analysis]
# PsychoPy has no type stubs, and its lazy imports and factory classes (for
# example `sound.Sound.__new__` returns a backend class) defeat inference.
# aria_et.protocols types the PsychoPy objects that aria-et uses.
replace-imports-with-any = ["psychopy", "psychopy.**"]

[tool.pixi.workspace]
channels = ["conda-forge"]
# Linux is used only by the isolated docs and lint environments in CI.
platforms = ["win-64", "linux-64"]
requires-pixi = ">=0.82.0"

[tool.pixi.dependencies]
python = "==3.10.21"
numpy = "==2.2.6"
pyside6 = "==6.11.2"
qt6-main = "==6.11.2"
pip = "*"
setuptools = ">=64"
wheel = "*"

[tool.pixi.pypi-dependencies]
aria-et = { path = ".", editable = true }
# These wheel hashes also pin their bundled media DLLs. Do not replace them
# with conda media packages without repeating the stimulus validation.
ffpyplayer = "==4.5.3"
psychtoolbox = "==3.0.22.2"
pyglet = "==1.4.11"
python-vlc = "==3.0.11115"
sounddevice = "==0.5.6"
soundfile = "==0.14.0"
moviepy = "==2.2.1"
imageio-ffmpeg = "==0.6.0"
opencv-python = "==5.0.0.93"
pyqt6 = "==6.11.0"
pyqt6-qt6 = "==6.11.2"

[tool.pixi.tasks]
gui = "aria-et-gui"

[tool.pixi.feature.test.dependencies]
pytest = "==9.1.1"
pytest-cov = "==7.1.0"
ruff = "==0.16.3"
vulture = "*"
pre-commit = "*"

[tool.pixi.feature.test.pypi-dependencies]
bids-validator-deno = "*"

[tool.pixi.feature.test.tasks]
test = "python -m pytest"
# The pre-commit hook and CI both run this task, so the checks cannot diverge.
typecheck = "ty check"

[tool.pixi.feature.docs.dependencies]
python = "==3.10.21"
sphinx = "*"
sphinxcontrib-youtube = "*"
furo = "*"

[tool.pixi.feature.docs.tasks]
docs = "sphinx-build -b html docs/source docs/_build/html"

[tool.pixi.feature.lint.dependencies]
python = "==3.10.21"
ruff = "==0.16.3"
numpydoc = "==1.10.0"

[tool.pixi.feature.lint.tasks]
lint = "ruff check . && ruff format --check ."
# The pre-commit hook runs this; CI runs the check-only `lint` above.
lint-fix = "ruff check --fix . && ruff format ."
# numpydoc validation of the API modules. The pre-commit hook and the CI
# `docstring` job both run this task. Add a module here once its docstrings pass.
docstrings = "numpydoc lint src/aria_et/__init__.py src/aria_et/config.py src/aria_et/bids/__init__.py src/aria_et/bids/export.py src/aria_et/session.py src/aria_et/runtime.py src/aria_et/protocols.py src/aria_et/sysinfo.py src/aria_et/eyetracker.py"

[tool.pixi.feature.logo.dependencies]
python = "==3.10.21"
matplotlib-base = "==3.10.9"
numpy = "==2.2.6"
pillow = "==12.3.0"
tomli = "*"

[tool.pixi.feature.logo.tasks]
generate-logos = "python logo/generate_aria_logos.py"

[tool.pixi.environments]
default = { features = ["gui", "test"], solve-group = "runtime", platforms = ["win-64"] }
prod = { features = ["gui"], solve-group = "runtime", platforms = ["win-64"] }
docs = { features = ["docs"], no-default-feature = true }
lint = { features = ["lint"], no-default-feature = true }
logo = { features = ["logo"], no-default-feature = true, platforms = ["win-64"] }

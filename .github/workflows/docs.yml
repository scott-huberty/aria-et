name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Only these two LFS images are embedded in the documentation.
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-docs-${{ hashFiles('src/aria_et/assets/abcct/activity-monitoring/images/ams_a0_s3_b3_gm_d1_f1.jpg', 'src/aria_et/assets/abcct/static-social-scenes/images/popout1_f0.jpg') }}

      - name: Fetch documentation images
        run: >-
          git lfs pull
          --include="src/aria_et/assets/abcct/activity-monitoring/images/ams_a0_s3_b3_gm_d1_f1.jpg,src/aria_et/assets/abcct/static-social-scenes/images/popout1_f0.jpg"
          --exclude=""

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          manifest-path: pyproject.toml
          pixi-version: v0.82.0
          environments: docs
          locked: true
          cache-key: pixi-docs-

      - name: Build docs
        run: pixi run --locked -e docs docs

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

# first time users: run pre-commit install to set up the git hook scripts
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
  - repo: local
    hooks:
    # Same command as the CI typecheck job (pixi task in pyproject.toml).
    - id: typecheck
      name: ty
      entry: pixi run --locked typecheck
      language: system
      pass_filenames: false
      types_or: [python, pyi, toml]
